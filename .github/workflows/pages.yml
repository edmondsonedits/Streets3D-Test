name: Publish playable tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate playable site
        run: python3 scripts/validate_site.py
      - name: Check capture-height navigation
        run: node scripts/test-splat-navigation.mjs
      - name: Check ratings and evidence contracts
        run: |
          node scripts/test-ratings.mjs
          node scripts/test-rating-efficiency.mjs
      - name: Check reference block data and geometry
        run: |
          python3 scripts/check-reference-data.py
          node scripts/test-reference-block.mjs
      - name: Check extracted block geography and navigation
        run: |
          python3 scripts/test_new_romaine_block.py
          node site/demos/new-romaine-block-v1/scripts/test-block-navigation.mjs
      - name: Check hybrid fire-truck driving
        run: |
          python3 scripts/test_hybrid_drive.py
          node site/demos/hybrid-fire-drive-v1/scripts/test-driving.mjs
          node site/demos/hybrid-fire-drive-v1/scripts/test-registration.mjs
          node site/demos/hybrid-fire-drive-v1/scripts/test-camera-obstacles.mjs
          node --loader ./site/demos/hybrid-fire-drive-v1/scripts/three-test-loader.mjs site/demos/hybrid-fire-drive-v1/scripts/test-vehicle.mjs
          node --loader ./site/demos/hybrid-fire-drive-v1/scripts/three-test-loader.mjs site/demos/hybrid-fire-drive-v1/scripts/test-splat-picking.mjs
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site only
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
